<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_8 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_8" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_8');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || 420;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
camera.position.set(22, 16, 26);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambLight = new THREE.AmbientLight(0x0a192f, 2.0);
scene.add(ambLight);

const dirLight = new THREE.DirectionalLight(0x00f2fe, 3.0);
dirLight.position.set(20, 30, 20);
scene.add(dirLight);

const pLight = new THREE.PointLight(0xef4444, 2.5, 50);
pLight.position.set(-15, 10, -10);
scene.add(pLight);

const mainGroup = new THREE.Group();
scene.add(mainGroup);

// 1. Grid Plane & Hyperplane Decision Surface (3D Feature Space: Lexical x N-Gram x Host Entropy)
const gridHelper = new THREE.GridHelper(28, 28, 0x06b6d4, 0x1e293b);
gridHelper.position.y = -4;
mainGroup.add(gridHelper);

// Non-linear Decision Boundary / 3D Manifold Surface
const surfaceGeo = new THREE.PlaneGeometry(24, 24, 24, 24);
surfaceGeo.rotateX(-Math.PI / 2);
const pos = surfaceGeo.attributes.position;
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i);
  const z = pos.getZ(i);
  // Multi-modal hyperbolic decision manifold
  const y = Math.sin(x * 0.3) * Math.cos(z * 0.3) * 2.2 + Math.sin(Math.sqrt(x*x + z*z) * 0.5) * 1.2;
  pos.setY(i, y - 2.5);
}
surfaceGeo.computeVertexNormals();

const surfaceMat = new THREE.MeshLambertMaterial({
  color: 0x083344,
  wireframe: true,
  transparent: true,
  opacity: 0.45
});
const decisionSurface = new THREE.Mesh(surfaceGeo, surfaceMat);
mainGroup.add(decisionSurface);

// 2. Multi-class 3D Clustered Threat Nodes (Phishing, Malware, Defacement, Benign)
// Classes: 0: Benign (green/cyan), 1: Phishing (red/amber), 2: Malware (magenta/purple), 3: Defacement (blue)
const clusterData = [
  { count: 45, center: new THREE.Vector3(7, 3, 6), color: 0xef4444, size: 0.45, type: 'box', label: 'Phishing' },
  { count: 35, center: new THREE.Vector3(-7, 2, -6), color: 0xec4899, size: 0.45, type: 'octa', label: 'Malware' },
  { count: 25, center: new THREE.Vector3(-6, -1, 7), color: 0x3b82f6, size: 0.4, type: 'tetra', label: 'Defacement' },
  { count: 55, center: new THREE.Vector3(4, -2, -5), color: 0x10b981, size: 0.35, type: 'sphere', label: 'Benign' }
];

const nodes = [];
const clusterGroup = new THREE.Group();
mainGroup.add(clusterGroup);

clusterData.forEach((cluster) => {
  for (let i = 0; i < cluster.count; i++) {
    let geo;
    if (cluster.type === 'box') geo = new THREE.BoxGeometry(cluster.size, cluster.size, cluster.size);
    else if (cluster.type === 'octa') geo = new THREE.OctahedronGeometry(cluster.size);
    else if (cluster.type === 'tetra') geo = new THREE.TetrahedronGeometry(cluster.size);
    else geo = new THREE.SphereGeometry(cluster.size * 0.8, 8, 8);

    const mat = new THREE.MeshLambertMaterial({
      color: cluster.color,
      transparent: true,
      opacity: 0.85
    });

    const mesh = new THREE.Mesh(geo, mat);
    const spread = 3.2;
    const px = cluster.center.x + (Math.random() - 0.5) * spread;
    const py = cluster.center.y + (Math.random() - 0.5) * spread * 0.8;
    const pz = cluster.center.z + (Math.random() - 0.5) * spread;

    mesh.position.set(px, py, pz);
    mesh.userData = {
      basePos: new THREE.Vector3(px, py, pz),
      speed: 0.5 + Math.random() * 0.8,
      phase: Math.random() * Math.PI * 2,
      cluster: cluster.label
    };

    clusterGroup.add(mesh);
    nodes.push(mesh);
  }
});

// 3. Real-Time Stream Simulation Trajectory (Flowing Test URL packets classified across manifold)
const streamParticlesCount = 20;
const streamGroup = new THREE.Group();
mainGroup.add(streamGroup);

const packetGeo = new THREE.SphereGeometry(0.35, 12, 12);
const packetMatPhish = new THREE.MeshBasicMaterial({ color: 0xff2a5f });
const packetMatBenign = new THREE.MeshBasicMaterial({ color: 0x00f2fe });

const streamPackets = [];
for (let i = 0; i < streamParticlesCount; i++) {
  const isPhish = Math.random() > 0.45;
  const pMesh = new THREE.Mesh(packetGeo, isPhish ? packetMatPhish : packetMatBenign);
  pMesh.userData = {
    progress: (i / streamParticlesCount),
    speed: 0.004 + Math.random() * 0.003,
    start: new THREE.Vector3(-14, 8, 14),
    target: isPhish ? new THREE.Vector3(7, 3, 6) : new THREE.Vector3(4, -2, -5),
    isPhish: isPhish
  };
  streamGroup.add(pMesh);
  streamPackets.push(pMesh);
}

// 4. Decision Vector Axis Indicators (X: TF-IDF N-Gram, Y: Shannon Entropy, Z: Lexical Path)
const axisMat = new THREE.LineBasicMaterial({ color: 0x00f2fe, opacity: 0.5, transparent: true });
const makeAxis = (from, to, colorHex) => {
  const geom = new THREE.BufferGeometry().setFromPoints([from, to]);
  const mat = new THREE.LineBasicMaterial({ color: colorHex, linewidth: 2 });
  return new THREE.Line(geom, mat);
};

mainGroup.add(makeAxis(new THREE.Vector3(0, -4, 0), new THREE.Vector3(14, -4, 0), 0x00f2fe)); // X
mainGroup.add(makeAxis(new THREE.Vector3(0, -4, 0), new THREE.Vector3(0, 10, 0), 0x10b981));  // Y
mainGroup.add(makeAxis(new THREE.Vector3(0, -4, 0), new THREE.Vector3(0, -4, 14), 0xa855f7)); // Z

// Orbit controls via Mouse
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };

container.addEventListener('mousedown', (e) => {
  isDragging = true;
  previousMousePosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => { isDragging = false; });

window.addEventListener('mousemove', (e) => {
  if (!isDragging) {
    // Subtle auto-tilt parallax
    const nx = (e.clientX - window.innerWidth / 2) * 0.0003;
    const ny = (e.clientY - window.innerHeight / 2) * 0.0003;
    mainGroup.rotation.y = nx * 1.5;
    mainGroup.rotation.x = ny * 0.8;
    return;
  }
  const deltaX = e.clientX - previousMousePosition.x;
  const deltaY = e.clientY - previousMousePosition.y;

  mainGroup.rotation.y += deltaX * 0.008;
  mainGroup.rotation.x += deltaY * 0.008;

  previousMousePosition = { x: e.clientX, y: e.clientY };
});

// Resize listener
window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || 420;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// Animation Loop
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  if (!isDragging) {
    mainGroup.rotation.y += 0.003;
  }

  // Floating oscillation of feature nodes
  nodes.forEach((n) => {
    n.position.y = n.userData.basePos.y + Math.sin(time * n.userData.speed + n.userData.phase) * 0.3;
    n.rotation.x += 0.01;
    n.rotation.y += 0.015;
  });

  // Animated URL Stream Packets along trajectory
  streamPackets.forEach((p) => {
    p.userData.progress += p.userData.speed;
    if (p.userData.progress > 1) {
      p.userData.progress = 0;
    }
    const prog = p.userData.progress;
    // Curved trajectory path
    p.position.lerpVectors(p.userData.start, p.userData.target, prog);
    p.position.y += Math.sin(prog * Math.PI) * 4.0;
  });

  // Pulse decision surface wireframe
  surfaceMat.opacity = 0.35 + Math.sin(time * 2) * 0.12;

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_8 -->
</body>
</html>
